{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
  <h1>{{ user.get_full_name|default:user.username }}'s Profile</h1>
  <p>Email: {{ user.email }}</p>
  <p>Joined: {{ user.date_joined }}</p>
  <a href="{% url 'accounts:edit_profile' %}">Edit profile</a>
{% endblock %}
