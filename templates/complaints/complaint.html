{% extends "base.html" %}

{% block title %}
Submit Complaint
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Submit a Complaint</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-primary"
        >
            Submit Complaint
        </button>

    </form>

</div>

{% endblock %}
