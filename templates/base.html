{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Abia Transit{% endblock %}
    </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            color: #1f2937;
            line-height: 1.6;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            background: #c8102e;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            opacity: 0.8;
        }

        .nav-button {
            background: #f5c400;
            color: #111827 !important;
            padding: 9px 18px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* ================= MAIN ================= */

        main {
            min-height: calc(100vh - 150px);
        }

        /* ================= FOOTER ================= */

        footer {
            background: #1f2937;
            color: white;
            padding: 30px 7%;
            text-align: center;
        }

        footer p {
            color: #d1d5db;
            font-size: 14px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <a href="{% url 'transport:home' %}" class="logo">
            Abia Transit
        </a>

        <div class="nav-links">

            <a href="{% url 'transport:home' %}">
                Home
            </a>

            <a href="#">
                Routes
            </a>

            <a href="#">
                Track
            </a>

            {% if user.is_authenticated %}

                <a href="#">
                    My Bookings
                </a>

                <a href="#" class="nav-button">
                    Account
                </a>

            {% else %}

                <a href="#" class="nav-button">
                    Login
                </a>

            {% endif %}

        </div>

    </nav>


    <!-- Page-specific content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- Footer -->
    <footer>
        <p>
            © 2026 Abia Transit. Connecting Abia, one journey at a time.
        </p>
    </footer>

</body>
</html>
