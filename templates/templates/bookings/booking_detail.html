{% extends "base.html" %}
{% block title %}Booking Detail{% endblock %}
{% block content %}
  <h1>Booking #{{ booking.id }}</h1>
  <p>Trip: {{ booking.trip }}</p>
  <p>Passenger: {{ booking.passenger }}</p>
  <p>Seats: {{ booking.seats }}</p>
  <p>Status: {{ booking.status }}</p>
  <a href="{% url 'bookings:list' %}">Back to bookings</a>
{% endblock %}
