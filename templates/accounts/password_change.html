{% extends "base.html" %}

{% block title %}Change Password | Abia Transit{% endblock %}

{% block content %}

<section class="auth-page">
    <div class="auth-card">

        <div class="auth-header">
            <h1>Change your password</h1>
            <p>Keep your Abia Transit account secure.</p>
        </div>

        <form method="POST" class="auth-form">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-button">
                Change Password
            </button>
        </form>

        <p class="auth-footer">
            <a href="{% url 'accounts:profile' %}">
                Back to Profile
            </a>
        </p>

    </div>
</section>

{% endblock %}
